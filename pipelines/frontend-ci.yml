trigger:
  branches:
    include:
      - main
  paths:
    include:
      - frontend/* # Only trigger if files in this folder change

pool:
  vmImage: 'ubuntu-latest'

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
  displayName: 'Install Node.js'

- script: |
    cd frontend
    npm install
    npm run build
  displayName: 'Build Frontend'

